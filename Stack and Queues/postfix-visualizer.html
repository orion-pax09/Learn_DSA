<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infix to Postfix: Stack Visualizer</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#12141a;--p:#1a1e27;--p2:#222733;--bd:#2d3342;--tx:#d7dce6;--mu:#8791a5;--cur:#4fd1c5;--ex:#f2b84b;--ok:#7bd88f;--no:#ff7a8a;--kw:#c792ea;--fn:#82aaff;--st:#c3e88d;--nm:#f78c6c;
--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;--ui:'IBM Plex Sans',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 var(--ui)}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--p)}
h1{font-size:17px;margin:0 12px 0 0}
input{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;font:15px var(--mono);width:260px;max-width:100%}
button{background:var(--p2);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:8px 14px;font:600 14px var(--ui);cursor:pointer}
button:hover{border-color:var(--cur)}button:focus-visible,input:focus-visible{outline:2px solid var(--cur);outline-offset:2px}
button.pri{background:var(--cur);color:#08201e;border-color:var(--cur)}
#err{width:100%;color:var(--no);font-size:14px;display:none}#warn{width:100%;color:var(--ex);font-size:14px;display:none}
.seg button{border-radius:0}.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}.seg .on{background:var(--ex);color:#2a1e00;border-color:var(--ex)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--bd)}
#cnt{font:700 14px var(--mono);margin-left:auto;color:var(--ex)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;padding:14px 16px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:var(--p);border:1px solid var(--bd);border-radius:8px;padding:12px;min-width:0}
.card h2{font-size:13px;margin:0 0 8px;color:var(--mu);font-weight:600}
#code{font:12.5px/1.55 var(--mono);max-height:78vh;overflow:auto;padding:0}
.ln{display:flex;white-space:pre;border-left:3px solid transparent}
.no{color:#555e72;width:34px;text-align:right;padding-right:10px;flex:none;user-select:none}
.ln.hot{background:rgba(242,184,75,.18);border-left-color:var(--ex)}
.k{color:var(--kw)}.f{color:var(--fn)}.s{color:var(--st)}.n{color:var(--nm)}
#chars{display:flex;flex-wrap:wrap;gap:5px}
.ch{font:700 18px var(--mono);width:34px;height:42px;display:grid;place-items:center;background:var(--p2);border:1px solid var(--bd);border-radius:6px;position:relative}
.ch small{position:absolute;bottom:-15px;font:10px var(--mono);color:var(--mu)}
.ch.done{opacity:.4}.ch.cur{background:var(--cur);color:#08201e;border-color:var(--cur);box-shadow:0 0 0 3px rgba(79,209,197,.3);opacity:1}
#chars{padding-bottom:16px}
.two{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;margin-top:14px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.slot{height:44px;display:flex;align-items:center;justify-content:center;color:var(--no);font:12px var(--mono)}
.cell{font:700 20px var(--mono);height:42px;display:flex;align-items:center;justify-content:center;background:var(--p2);border:2px solid var(--bd);border-bottom-width:0;position:relative}
.cell:last-child{border-bottom-width:2px;border-radius:0 0 6px 6px}
.cell.top{border-color:var(--ex);color:var(--ex)}
.cell.top::after{content:"← TOP";position:absolute;left:100%;margin-left:8px;font:700 12px var(--mono);color:var(--ex);white-space:nowrap}
.cell.enter{animation:drop .5s ease-out;background:rgba(123,216,143,.3);border-color:var(--ok)}
.cell.leave{animation:out .8s ease-in forwards;background:rgba(255,122,138,.25);border:2px solid var(--no);color:var(--no);width:100%;border-radius:6px}
@keyframes drop{from{transform:translateY(-46px);opacity:0}to{transform:none;opacity:1}}
@keyframes out{to{transform:translateY(-30px);opacity:0}}
.empty{height:42px;display:grid;place-items:center;color:var(--mu);font:12px var(--mono);border:2px dashed var(--bd);border-radius:0 0 6px 6px}
#stack{min-height:130px}
#post{font:700 26px var(--mono);letter-spacing:6px;min-height:42px;word-break:break-all}
#post span.new{background:var(--ok);color:#06210d;border-radius:4px;animation:pulse .9s}
@keyframes pulse{from{transform:scale(1.5)}to{transform:none}}
pre{margin:0;font:13px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word}
#state{color:var(--tx)}
#cond{background:var(--bg);border-radius:6px;padding:8px 10px;border-left:3px solid var(--cur);min-height:44px}
#act{font-weight:700;color:var(--ok);margin-top:8px}
#cpp{background:var(--bg);border-radius:6px;padding:8px 10px;color:var(--st);border-left:3px solid var(--ex)}
#expl{font-size:16px;line-height:1.55}
.g{display:grid;gap:12px;margin-top:14px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<header>
<h1>Infix → Postfix with a stack</h1>
<input id="inp" value="(A+B*C)/(D-(E-F))" aria-label="Infix expression" spellcheck="false">
<button class="pri" id="go">Visualize</button>
<span class="seg"><button id="mb" class="on">Beginner mode</button><button id="mc">Code execution mode</button></span>
<div id="err"></div><div id="warn"></div>
</header>
<div class="bar">
<button id="prev">← Previous</button><button id="next">Next →</button><button id="play">▶ Play</button><button id="reset">Reset</button>
<span id="cnt"></span>
</div>
<div class="wrap">
<div class="card"><h2>C++ code (executing line is highlighted)</h2><div id="code"></div></div>
<div>
<div class="card"><h2>Input expression</h2><div id="chars"></div><pre id="cur"></pre></div>
<div class="two">
<div class="card"><h2>Stack</h2><div class="slot" id="slot"></div><div id="stack"></div></div>
<div class="card"><h2>Postfix result (res)</h2><div id="post"></div><pre id="state" style="margin-top:12px"></pre></div>
</div>
<div class="g">
<div class="card"><h2>Condition being evaluated</h2><div id="cond"></div><div id="act"></div></div>
<div class="card"><h2>What the code does</h2><pre id="cpp"></pre></div>
<div class="card"><h2 id="eh">Explanation</h2><div id="expl"></div></div>
</div></div></div>
<script>
const CODE=`int precedence(char op)
{
    if (op == '+' || op == '-')
        return 1;
    else if (op == '*' || op == '/')
        return 2;
    else if (op == '^')
        return 3;

    return 0;
}

void to_postfix(string *s)
{
    string res = "";
    int i = 0;
    stack<char> st;
    int size = s->size();

    while (i < size)
    {
        if (((*s)[i] >= 'A' && (*s)[i] <= 'Z') ||
            ((*s)[i] >= 'a' && (*s)[i] <= 'z') ||
            ((*s)[i] >= '0' && (*s)[i] <= '9'))
        {
            res = res + (*s)[i];
        }

        else if ((*s)[i] == '(')
        {
            st.push((*s)[i]);
        }

        else if ((*s)[i] == ')')
        {
            while (!st.empty() && st.top() != '(')
            {
                res = res + st.top();
                st.pop();
            }

            if (!st.empty())
            {
                st.pop();
            }
        }

        else
        {
            while (!st.empty() &&
                   st.top() != '(' &&
                   precedence(st.top()) >= precedence((*s)[i]))
            {
                res = res + st.top();
                st.pop();
            }

            st.push((*s)[i]);
        }

        i++;
    }

    while (!st.empty())
    {
        res = res + st.top();
        st.pop();
    }

    cout << res;
}`.split('\n');
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const RE=/('[^']*')|("[^"]*")|\b(int|void|char|string|stack|while|if|else|return|cout)\b|\b(\d+)\b|\b(precedence|push|pop|top|empty|size|to_postfix)\b(?=\()/g;
const hl=l=>esc(l).replace(RE,(m,a,b,c,d,e)=>a||b?`<span class="s">${m}</span>`:c?`<span class="k">${m}</span>`:d?`<span class="n">${m}</span>`:`<span class="f">${m}</span>`);
$('code').innerHTML=CODE.map((l,i)=>`<div class="ln" id="L${i}"><span class="no">${i+1}</span><span>${hl(l)}</span></div>`).join('');

const q=c=>`'${c}'`;
function gen(e){
  const T=[],n=e.length;let st=[],res='',i=null;
  const pr=c=>'+-'.includes(c)?1:'*/'.includes(c)?2:c==='^'?3:0;
  const top=()=>st[st.length-1];
  const S=o=>T.push({st:[...st],res,i,ch:i!==null&&i<n?e[i]:null,cond:[],...o});
  const addTop=(l,why)=>{const t=top(),old=res;res+=t;S({l,add:true,act:`Append ${q(t)} to postfix`,cond:[],cpp:`res = res + st.top();\n\nst.top() = ${q(t)}\nres     = "${old}"\nnew res = "${res}"`,b:`${q(t)} ${why} It goes to the output.`,c:`st.top() returns ${q(t)}; it is concatenated onto res.`});};
  const popTop=(l,note)=>{const t=st.pop();S({l,pop:t,act:`Pop ${q(t)} off the stack`,cpp:`st.pop();\n\nRemove ${q(t)} from TOP of stack`,b:note||`Now remove ${q(t)} from the stack, since it has been written to the output.`,c:`st.pop() removes ${q(t)}. Stack size is now ${st.length}.`});};
  S({l:14,act:'Create empty result',cpp:'string res = "";',b:'We start with an empty postfix result.',c:'res is initialised to "".'});
  i=0;S({l:15,act:'i = 0',cpp:'int i = 0;',b:'We start reading at the first character (index 0).',c:'i is initialised to 0.'});
  S({l:16,act:'Create empty stack',cpp:'stack<char> st;',b:'The stack is empty. It will hold operators and "(" that must wait.',c:'An empty stack of char is created.'});
  S({l:17,act:`size = ${n}`,cpp:`int size = s->size();\n\nsize = ${n}`,b:`The expression has ${n} characters.`,c:`size = ${n}.`});
  while(true){
    const ok=i<n;
    S({l:19,cond:[`i < size  →  ${i} < ${n}  →  ${ok?'TRUE':'FALSE'}`],act:ok?'Enter loop body':'Leave main loop',cpp:'while (i < size)',b:ok?`Characters remain. Read character ${q(e[i])} at index ${i}.`:'Every character has been read. Now we empty the stack.',c:ok?'Condition true, body runs.':'Condition false, jump to final while.'});
    if(!ok)break;
    const c=e[i],isA=/[A-Za-z0-9]/.test(c);
    S({l:21,l2:23,cond:[`${q(c)} is A-Z, a-z or 0-9?  →  ${isA?'TRUE':'FALSE'}`],act:isA?'Operand: go to first branch':'Not an operand: try next branch',cpp:'if (letter || letter || digit)',b:isA?`${q(c)} is an operand (letter or digit).`:`${q(c)} is not a letter or digit, so check the other cases.`,c:isA?'First if is true.':'First if is false, move to else if.'});
    if(isA){
      const old=res;res+=c;
      S({l:25,add:true,act:`Append ${q(c)} to postfix`,cpp:`res = res + (*s)[i];\n\n(*s)[i] = ${q(c)}\nres     = "${old}"\nnew res = "${res}"`,b:`Operands never go into the stack. We add ${q(c)} straight to the postfix result.`,c:`(*s)[i] is ${q(c)}; res becomes "${res}".`});
    }else{
      const o=c==='(';
      S({l:28,cond:[`(*s)[i] == '('  →  ${q(c)} == '('  →  ${o?'TRUE':'FALSE'}`],act:o?'Open-parenthesis branch':'Not "(": try next branch',cpp:"else if ((*s)[i] == '(')",b:o?'This is an opening parenthesis.':`${q(c)} is not "(".`,c:o?'Branch taken.':'Branch skipped.'});
      if(o){st.push(c);S({l:30,push:true,act:`Push ${q(c)} onto stack`,cpp:`st.push((*s)[i]);\n\nPush '(' onto stack`,b:'"(" is an opening parenthesis, so we push it onto the stack. It marks where a group starts.',c:'st.push(\'(\'); stack size is now '+st.length+'.'});}
      else{
        const cl=c===')';
        S({l:33,cond:[`(*s)[i] == ')'  →  ${q(c)} == ')'  →  ${cl?'TRUE':'FALSE'}`],act:cl?'Close-parenthesis branch':'Not ")": it must be an operator',cpp:"else if ((*s)[i] == ')')",b:cl?'")" means the group has ended. We must pop operators until we find "(".':`${q(c)} is not a parenthesis, so it is an operator.`,c:cl?'Branch taken.':'Branch skipped, falls to else.'});
        if(cl){
          while(true){
            let em=st.length===0;
            S({l:35,cond:[`!st.empty()  →  stack has ${st.length} item(s)  →  ${!em?'TRUE':'FALSE'}`],act:em?'Stack empty: stop popping':'Stack not empty: check the top',cpp:'while (!st.empty() && ...',b:em?'The stack is empty, so there is nothing left to pop.':'The stack still has items, so look at the top one.',c:'First half of && condition'+(em?' is false: loop exits (short-circuit).':' is true: evaluate second half.')});
            if(em)break;
            const t=top();
            S({l:35,cond:[`st.top() != '('  →  ${q(t)} != '('  →  ${t!=='('?'TRUE':'FALSE'}`],act:t!=='('?'Not "(": pop it to output':'Found "(": stop',cpp:"... && st.top() != '(')",b:t!=='('?`The top is ${q(t)}, not "(", so it belongs inside this group. Move it to the output.`:'The top is "(": we found the start of the group. Stop.',c:t!=='('?'Both conditions true: loop body runs.':'Condition false: loop exits.'});
            if(t==='(')break;
            addTop(37,'is inside the parentheses, so it must come out.');
            popTop(38);
          }
          const em=st.length===0;
          S({l:41,cond:[`!st.empty()  →  ${!em?'TRUE':'FALSE'}`],act:em?'Nothing to discard':'Discard the "("',cpp:'if (!st.empty())',b:em?'The stack is empty (unbalanced ")"), so nothing is discarded.':'The top is "(". We will discard it.',c:em?'if is false, skip pop.':'if is true, pop the "(".'});
          if(!em)popTop(43,'The "(" is removed but NOT added to postfix. Postfix never contains parentheses.');
        }else{
          S({l:47,act:'Operator branch',cpp:'else',b:`${q(c)} is an operator. Compare it with the operator on top of the stack.`,c:'Neither operand, "(" nor ")": else branch.'});
          while(true){
            let em=st.length===0;
            S({l:49,cond:[`!st.empty()  →  stack has ${st.length} item(s)  →  ${!em?'TRUE':'FALSE'}`],act:em?'Stack empty: stop popping':'Stack not empty: continue checking',cpp:'while (!st.empty() && ...',b:em?'The stack is empty, so there is nothing to compare with.':'The stack has an operator to compare against.',c:em?'First condition false: loop exits.':'First condition true.'});
            if(em)break;
            const t=top();
            S({l:50,cond:[`st.top() != '('  →  ${q(t)} != '('  →  ${t!=='('?'TRUE':'FALSE'}`],act:t!=='('?'Top is not "(": compare precedence':'Top is "(": stop',cpp:"... && st.top() != '(' && ...",b:t!=='('?`The top is ${q(t)}, so we can compare.`:'"(" is a wall: operators never pop it here. Stop.',c:t!=='('?'Second condition true.':'Second condition false: loop exits.'});
            if(t==='(')break;
            const a=pr(t),b=pr(c),r=a>=b;
            S({l:51,cond:[`Current operator: ${c}`,`Stack top: ${t}`,'',`precedence(${t}) = ${a}  (stack top)`,`precedence(${c}) = ${b}  (current)`,'',`${a} >= ${b}  →  ${r?'TRUE':'FALSE'}`,'',r?`Therefore: POP ${t}, add ${t} to postfix, then check the stack again`:`Therefore: DO NOT POP ${t}, PUSH ${c}`],act:r?`${q(t)} is stronger or equal: pop it`:`${q(t)} is weaker: leave it`,cpp:'precedence(st.top()) >= precedence((*s)[i])',b:r?`${q(t)} on the stack has equal or higher priority than ${q(c)}, so ${q(t)} must be done first. Pop it.`:`${q(c)} has higher priority than ${q(t)}, so ${q(t)} must wait in the stack.`,c:r?'Condition true: loop body runs.':'Condition false: loop exits.'});
            if(!r)break;
            addTop(53,`has priority over or equal to ${q(c)}.`);
            popTop(54);
          }
          st.push(c);S({l:57,push:true,act:`Push ${q(c)} onto stack`,cpp:`st.push((*s)[i]);\n\nPush ${q(c)} onto stack`,b:`Now ${q(c)} waits on the stack until something forces it out.`,c:`st.push(${q(c)}); stack size is now ${st.length}.`});
        }
      }
    }
    i++;S({l:60,act:i<n?`Move to index ${i}`:'Past the last character',cond:[`i++  →  i = ${i}`],cpp:'i++;',b:i<n?`Move on to the next character.`:'That was the last character.',c:`i is now ${i}.`});
  }
  while(true){
    const em=st.length===0;
    S({l:63,cond:[`!st.empty()  →  stack has ${st.length} item(s)  →  ${!em?'TRUE':'FALSE'}`],act:em?'Stack empty: done':'Pop remaining operators',cpp:'while (!st.empty())',b:em?'The stack is empty. We are finished.':'The input is finished, but operators are still in the stack. We pop them one by one and append them to the postfix expression.',c:em?'Condition false: loop exits.':'Condition true: body runs.'});
    if(em)break;
    addTop(65,'was still waiting in the stack.');popTop(66);
  }
  S({l:69,act:`Output: ${res}`,cpp:`cout << res;\n\nPrints: ${res}`,b:`Done! The postfix expression is ${res}.`,c:`cout prints "${res}".`,fin:true});
  return T;
}

let T=[],k=0,timer=null,mode='b',E='';
function start(){
  stop();const v=$('inp').value.replace(/\s+/g,''),er=$('err'),w=$('warn');
  const bad=[...new Set(v.split('').filter(c=>!/[A-Za-z0-9+\-*\/^()]/.test(c)))];
  er.style.display=w.style.display='none';
  if(!v){er.textContent='Enter an expression first, for example A+B*C.';er.style.display='block';return;}
  if(bad.length){er.textContent=`Unsupported character(s): ${bad.map(q).join(' ')}. Use letters, digits, + - * / ^ ( and ).`;er.style.display='block';return;}
  let d=0,neg=false;for(const c of v){if(c==='(')d++;if(c===')'){d--;if(d<0)neg=true;}}
  if(d!==0||neg){w.textContent='Heads up: the parentheses are not balanced. The visualizer still follows the C++ code exactly, so a leftover "(" will end up in the output.';w.style.display='block';}
  E=v;T=gen(v);k=0;render(false);
}
function render(anim){
  const s=T[k],n=T.length;
  $('cnt').textContent=`Step ${k+1} / ${n}`;
  document.querySelectorAll('.ln.hot').forEach(x=>x.classList.remove('hot'));
  for(let l=s.l;l<=(s.l2||s.l);l++)$('L'+l).classList.add('hot');
  $('L'+s.l).scrollIntoView({block:'nearest'});
  $('chars').innerHTML=[...E].map((c,j)=>`<div class="ch ${s.i!==null&&j<s.i?'done':''} ${j===s.i?'cur':''}">${esc(c)}<small>${j}</small></div>`).join('');
  $('cur').textContent=`Current character: ${s.ch===null?'(none)':s.ch}\nIndex (i): ${s.i===null?'-':s.i}`;
  const L=s.st.length;
  $('stack').innerHTML=(L?s.st.map((c,j)=>j).reverse().map(j=>{const top=j===L-1;return `<div class="cell ${top?'top':''} ${top&&s.push&&anim?'enter':''}">${esc(s.st[j])}</div>`}).join(''):'')+'<div class="empty" style="'+(L?'display:none':'')+'">(empty)</div>';
  $('slot').innerHTML=s.pop!==undefined?`<div class="cell leave">${esc(s.pop)}${anim?'':''}</div>`:'';
  if(s.pop!==undefined&&!anim)$('slot').firstChild.style.animation='none',$('slot').firstChild.style.opacity='.55';
  $('post').innerHTML=[...s.res].map((c,j)=>`<span class="${s.add&&j===s.res.length-1?'new':''}">${esc(c)}</span>`).join('')||'<span style="color:var(--mu);font-size:14px;letter-spacing:0">(empty)</span>';
  $('state').textContent=`Stack: [ ${s.st.join(', ')} ]  (bottom → top)\nTop: ${L?s.st[L-1]:'none'}\nPostfix: ${s.res||'(empty)'}`;
  $('cond').textContent=s.cond.length?s.cond.join('\n'):'(no condition on this line)';
  $('cond').style.whiteSpace='pre-wrap';$('cond').style.font='13px/1.6 var(--mono)';
  $('act').textContent='ACTION: '+s.act;
  $('cpp').textContent=s.cpp;
  $('eh').textContent=mode==='b'?'Explanation (beginner)':'Explanation (code execution)';
  $('expl').textContent=mode==='b'?s.b:s.c;
  $('prev').disabled=k===0;$('next').disabled=k===n-1;
  if(k===n-1)stop();
}
const go=d=>{if(!T.length)return;const nk=k+d;if(nk<0||nk>=T.length)return;k=nk;render(d>0)};
function stop(){clearInterval(timer);timer=null;$('play').textContent='▶ Play'}
function play(){if(timer){stop();return}if(k>=T.length-1)k=0;$('play').textContent='❚❚ Pause';timer=setInterval(()=>go(1),1300)}
$('go').onclick=start;$('next').onclick=()=>go(1);$('prev').onclick=()=>go(-1);$('play').onclick=play;
$('reset').onclick=()=>{stop();k=0;render(false)};
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter')start();e.stopPropagation()});
$('mb').onclick=()=>{mode='b';$('mb').classList.add('on');$('mc').classList.remove('on');render(false)};
$('mc').onclick=()=>{mode='c';$('mc').classList.add('on');$('mb').classList.remove('on');render(false)};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();go(1)}if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}});
start();
</script></body></html>
